
name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Debug environment
      run: |
        echo "NODE_ENV: $NODE_ENV"
        echo "Building with relative paths for GitHub Pages"
        
    - name: Build
      run: npm run build
      env:
        VITE_SUPABASE_URL: 'https://ubbqfkuqomemfhktobjh.supabase.co'
        VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViYnFma3Vxb21lbWZoa3RvYmpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc0NDkwNzEsImV4cCI6MjA2MzAyNTA3MX0.vdw_fHytoL3hvZhVxR6Li5o9_scJf5_5_HR9G4T8vfM'
        
    - name: Create 404.html
      run: |
        echo "Creating 404.html that redirects to index.html"
        cp dist/index.html dist/404.html
        
    - name: List build output
      run: |
        echo "Contents of dist directory:"
        ls -la dist/
        
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist
        branch: gh-pages
        clean: true # Automatically remove deleted files
